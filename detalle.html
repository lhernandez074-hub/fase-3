<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    Tienda de Maquillaje
                </a>

                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <h1 class="text-center mb-5">Información del producto</h1>

        <div id="detalleProducto" class="row justify-content-center">

            <div class="col-md-5 text-center">
                <img id="imagenProducto"
                     src="https://via.placeholder.com/400"
                     alt="Producto"
                     class="img-fluid">
            </div>

            <div class="col-md-5">

                <h2 id="nombreProducto">Nombre del producto</h2>

                <p id="marcaProducto">
                    Marca:
                </p>

                <p id="categoriaProducto">
                    Categoría:
                </p>

                <p id="precioProducto">
                    Precio:
                </p>

                <p id="descripcionProducto">
                    Descripción del producto.
                </p>

                <a href="productos.html" class="btn btn-primary">
                    Regresar al catálogo
                </a>

            </div>

        </div>

    </main>

    <footer class="text-center p-4 mt-5">
        <p>Proyecto de desarrollo web</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
