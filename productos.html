<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html">Tienda de Maquillaje</a>

                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <h1 class="text-center">Catálogo de Productos</h1>

        <div class="row mt-4">
            <div class="col-md-8">
                <input type="text" id="buscador" class="form-control"
                       placeholder="Buscar producto...">
            </div>

            <div class="col-md-4">
                <select id="categoria" class="form-select">
                    <option value="todos">Todas las categorías</option>
                    <option value="lipstick">Labiales</option>
                    <option value="foundation">Bases</option>
                    <option value="eyeshadow">Sombras</option>
                    <option value="blush">Rubores</option>
                    <option value="mascara">Máscara de pestañas</option>
                </select>
            </div>
        </div>

        <div id="productos" class="row mt-5">
            <p class="text-center">Cargando productos...</p>
        </div>

    </main>

    <footer class="text-center p-4 mt-5">
        <p>Proyecto de desarrollo web</p>
    </footer>

    <script src="./js/app.js?v=2"></script>

</body>
</html>
